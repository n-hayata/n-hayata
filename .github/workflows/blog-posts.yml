name: Update Blog Posts

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://zenn.dev/p/triplethree/feed"
          max_post_count: 5
          date_format: "yyyy-mm-dd"
          template: "- [$title]($url) — $date$newline"
          commit_message: "docs: update tech blog posts"
