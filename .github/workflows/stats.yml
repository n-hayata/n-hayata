name: stats

on:
  schedule:
    - cron: '17 21 * * *' # 06:17 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # プライベートリポジトリ分を含めるため、bot トークンではなく本人の PAT を使う
      - run: node scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit refreshed stats
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats-light.svg assets/stats-dark.svg
          git diff --cached --quiet || git commit -m 'chore: refresh stats'
          git push
